# =============================================================
#  Snapshot de la entrega v0.1.0 (TP2): usa la imagen de la base con
#  init.sql. Desde el Sprint 2 el esquema lo crean las migraciones del
#  backend, así que este archivo sólo sirve con los tags v0.1.0.
#  Igual que docker-compose.yml pero BAJA las imágenes del registry
#  en vez de construirlas. Levanta el sistema sin el código fuente:
#    cp .env.example .env   # y editar la contraseña
#    docker compose -f docker-compose.registry.yml up -d
# =============================================================
services:
  db:
    image: ghcr.io/joaquinlista/panaderia-gestion-db:v0.1.0
    container_name: panaderias_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: panaderias
      POSTGRES_USER: panaderias
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definí POSTGRES_PASSWORD en .env (cp .env.example .env)}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U panaderias -d panaderias"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - panaderias_net

  backend:
    image: ghcr.io/joaquinlista/panaderia-gestion-backend:v0.1.0
    container_name: panaderias_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: panaderias
      POSTGRES_USER: panaderias
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definí POSTGRES_PASSWORD en .env (cp .env.example .env)}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - panaderias_net

  frontend:
    image: ghcr.io/joaquinlista/panaderia-gestion-frontend:v0.1.0
    container_name: panaderias_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - panaderias_net

volumes:
  postgres_data:
    driver: local

networks:
  panaderias_net:
    driver: bridge
