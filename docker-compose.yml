# Nombre fijo del proyecto: Docker lo usa como prefijo de la red y del volumen de
# la base. Sin esto usaría el nombre de la carpeta, y otro proyecto clonado en una
# carpeta con el mismo nombre compartiría la base de datos.
name: lafueguina

services:
  db:
    # Imagen oficial sin scripts propios: el esquema lo crea el backend al
    # arrancar, con las migraciones de backend/migrations.
    image: postgres:15-alpine
    container_name: lafueguina_db
    restart: unless-stopped
    environment:
      # POSTGRES_DB y POSTGRES_USER no son secretos: van literales.
      # La contraseña sí: entra por .env y el compose falla si no está.
      POSTGRES_DB: panaderias
      POSTGRES_USER: panaderias
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definí POSTGRES_PASSWORD en .env (cp .env.example .env)}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U panaderias -d panaderias"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - lafueguina_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ghcr.io/joaquinlista/panaderia-gestion-backend:v0.1.0
    container_name: lafueguina_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: panaderias
      POSTGRES_USER: panaderias
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definí POSTGRES_PASSWORD en .env (cp .env.example .env)}
      # Secretos del login: entran por .env y el compose no levanta si faltan.
      JWT_SECRET: ${JWT_SECRET:?Definí JWT_SECRET en .env (openssl rand -hex 32)}
      ADMIN_USUARIO: ${ADMIN_USUARIO:?Definí ADMIN_USUARIO en .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Definí ADMIN_PASSWORD en .env}
      # El compose local se usa por http://localhost: sin HTTPS, una cookie
      # Secure no viajaría. En un entorno con HTTPS va en true.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - lafueguina_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ghcr.io/joaquinlista/panaderia-gestion-frontend:v0.1.0
    container_name: lafueguina_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - lafueguina_net

  # ---- Monitoreo (Sprint 8, #18) ----
  # Opcional: sólo se levanta con `docker compose --profile monitoreo up -d`.
  # Prometheus lee /metrics del backend y evalúa las alertas; Grafana dibuja
  # el tablero. Los puertos se abren sólo en la propia compu (127.0.0.1).
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: lafueguina_prometheus
    profiles: [monitoreo]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./monitoreo/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - lafueguina_net

  grafana:
    image: grafana/grafana:12.1.0
    container_name: lafueguina_grafana
    profiles: [monitoreo]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # Grafana pide cambiarla la primera vez si queda en "admin".
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_DEFAULT_LANGUAGE: es-ES
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/tableros/la-fueguina.json
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
    volumes:
      - ./monitoreo/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoreo/grafana/tableros:/var/lib/grafana/tableros:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus
    networks:
      - lafueguina_net

volumes:
  postgres_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  lafueguina_net:
    driver: bridge
