# =============================================================
#  Infraestructura (Terraform, carpeta infra/)
#
#  - En cada PR que toca infra/: formato, validación, tflint y `terraform test`
#    (sin Azure). Si Azure ya está conectado, además el plan como comentario.
#  - Al mergear a main: el plan y, con la aprobación del ambiente `infra`,
#    el apply.
#
#  Azure se conecta cargando las variables del repo que imprime
#  infra/bootstrap/preparar-azure.sh. Hasta entonces sólo corre la validación.
# =============================================================
name: Infra

on:
  pull_request:
    paths: ['infra/**', '.github/workflows/infra.yml']
  push:
    branches: [main]
    paths: ['infra/**', '.github/workflows/infra.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Nunca dos applies a la vez sobre el mismo estado.
  group: infra-${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
  cancel-in-progress: false

env:
  TF_VERSION: 1.16.4
  TF_IN_AUTOMATION: 'true'
  # GitHub entra a Azure con OIDC: ninguna de estas variables es un secreto.
  ARM_USE_OIDC: 'true'
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

defaults:
  run:
    working-directory: infra

jobs:
  validar:
    name: Terraform · formato, validación y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Formato (terraform fmt)
        run: terraform fmt -check -recursive -diff

      - name: Init sin backend
        run: terraform init -backend=false -input=false

      - name: Validación (terraform validate)
        run: terraform validate

      # Revisa el plan con proveedores de mentira: no necesita Azure.
      - name: Tests (terraform test)
        run: terraform test

      - uses: terraform-linters/setup-tflint@v6

      - name: tflint
        env:
          # tflint baja las reglas de Azure de GitHub; con el token no lo limitan.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init
          tflint --recursive --format compact

  plan:
    name: Terraform · plan
    needs: validar
    # Sólo con Azure conectado y en PRs del mismo repo (a los forks GitHub no
    # les da el token de OIDC).
    if: >-
      github.event_name == 'pull_request' && vars.AZURE_CLIENT_ID != '' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      # Secreto del repo; vacío si no existe (los reportes andan igual, sin issue).
      TF_VAR_github_token_reportes: ${{ secrets.GITHUB_TOKEN_REPORTES }}
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Init
        run: terraform init -input=false -backend-config="storage_account_name=${{ vars.TFSTATE_CUENTA }}"

      - name: Plan
        id: plan
        run: |
          set -o pipefail
          terraform plan -input=false -no-color -lock=false | tee plan.txt

      - name: Comentar el plan en el PR
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const MARCA = '<!-- terraform-plan -->';
            let plan = fs.readFileSync('infra/plan.txt', 'utf8');
            const resumen = plan.match(/^(Plan:.*|No changes\..*)$/m)?.[0] ?? 'Ver el log del job.';
            if (plan.length > 60000) plan = '…(recortado, el plan completo está en el log del job)\n' + plan.slice(-60000);
            const body = `${MARCA}\n### Terraform plan\n\n**${resumen}**\n\n<details><summary>Plan completo</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>\n\nSe aplica al mergear, con la aprobación del ambiente \`infra\`.`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comentarios = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const previo = comentarios.find((c) => c.user.type === 'Bot' && c.body.includes(MARCA));
            if (previo) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previo.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  aplicar:
    name: Terraform · apply
    needs: validar
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    # El ambiente `infra` pide la aprobación del PM antes de arrancar este job.
    environment: infra
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_github_token_reportes: ${{ secrets.GITHUB_TOKEN_REPORTES }}
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Init
        run: terraform init -input=false -backend-config="storage_account_name=${{ vars.TFSTATE_CUENTA }}"

      - name: Plan
        run: terraform plan -input=false -out=tfplan

      - name: Apply
        run: terraform apply -input=false tfplan

      - name: Direcciones
        run: |
          {
            echo "### Infraestructura aplicada"
            echo "- Staging: $(terraform output -raw url_staging)"
            echo "- Producción: $(terraform output -raw url_produccion)"
          } >> "$GITHUB_STEP_SUMMARY"
