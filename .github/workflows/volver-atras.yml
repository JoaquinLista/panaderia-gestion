# =============================================================
#  Volver a la versión anterior
#
#  Actions → "Volver a la versión anterior" → Run workflow → elegir el ambiente.
#  Vuelve a desplegar las imágenes de la versión que corría antes del último
#  despliegue (backend y pantalla). Correrlo otra vez deshace la vuelta atrás.
#
#  Ojo: la base de datos no vuelve atrás. Por eso las migraciones sólo agregan
#  (ver decisiones.md, Sprint 6).
# =============================================================
name: Volver a la versión anterior

on:
  workflow_dispatch:
    inputs:
      ambiente:
        description: Ambiente
        type: choice
        options: [produccion, staging]
        default: produccion

permissions:
  contents: read

concurrency:
  group: desplegar
  cancel-in-progress: false

jobs:
  volver:
    name: Volver atrás en ${{ inputs.ambiente }}
    runs-on: ubuntu-latest
    # En producción también pide la aprobación del ambiente.
    environment: ${{ inputs.ambiente }}
    permissions:
      contents: read
      id-token: write
    env:
      APP: lafueguina-${{ inputs.ambiente }}
    steps:
      - uses: actions/checkout@v7

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Volver a la versión anterior
        run: |
          anterior=$(infra/scripts/desplegar.sh anterior "$APP")
          infra/scripts/desplegar.sh actualizar "$APP" "$anterior"
          infra/scripts/desplegar.sh esperar "$APP" "$anterior"
          url=$(infra/scripts/desplegar.sh url "$APP")
          echo "${{ inputs.ambiente }} volvió a \`${anterior:0:7}\`: $url" >> "$GITHUB_STEP_SUMMARY"
