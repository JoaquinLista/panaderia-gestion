# Pipeline de Integración Continua (Pipelines as Code).
# Corre en cada PR a main y en cada push a main. Si algún paso falla, el check
# queda en rojo y la protección de la rama impide mergear.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Si llega un push nuevo al mismo PR, se cancela la corrida anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Mínimo privilegio: el pipeline sólo necesita leer el código.
permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.paquete }} · lint, tests y coverage
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        paquete: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.paquete }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.paquete }}/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formato
        run: npm run format:check

      - name: Tests + umbral de coverage
        run: npm run test:coverage

      - name: Build
        if: matrix.paquete == 'frontend'
        run: npm run build

      - name: Resumen de coverage
        if: always() && hashFiles(format('{0}/coverage/coverage-summary.json', matrix.paquete)) != ''
        run: |
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            const fila = (k, n) => `| ${n} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
            console.log([
              "### Coverage · ${{ matrix.paquete }}",
              "| Métrica | % | Cubiertas |",
              "|---|---|---|",
              fila("lines", "Líneas"),
              fila("statements", "Sentencias"),
              fila("functions", "Funciones"),
              fila("branches", "Ramas"),
            ].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar reporte de coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.paquete }}
          path: ${{ matrix.paquete }}/coverage/
          if-no-files-found: ignore
          retention-days: 14

  migraciones:
    name: Migraciones · Postgres real
    runs-on: ubuntu-latest
    # Postgres de servicio: un contenedor que vive sólo durante este job.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Migraciones desde cero y sobre el esquema del TP2
        run: npm run test:integracion
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

  despliegue:
    name: Scripts de despliegue · shellcheck y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # shellcheck ya viene instalado en los runners de GitHub.
      - name: shellcheck
        run: shellcheck infra/scripts/*.sh infra/scripts/pruebas/*.sh infra/scripts/pruebas/az infra/scripts/pruebas/curl

      # blue-green.sh con un `az` de mentira: prepara, pasa el tráfico y vuelve atrás.
      - name: Pruebas del blue-green
        run: bash infra/scripts/pruebas/blue-green.test.sh

  docker:
    name: Docker · build y smoke test
    needs: [test, migraciones]
    runs-on: ubuntu-latest
    env:
      # Valores descartables: la base y las sesiones sólo viven durante este job.
      POSTGRES_PASSWORD: ci-solo-para-pruebas
      ADMIN_USUARIO: admin-ci
      ADMIN_PASSWORD: ci-solo-para-pruebas
    steps:
      - uses: actions/checkout@v7

      - name: Generar el secreto de las sesiones
        run: echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Construir imágenes
        run: docker compose build

      - name: Levantar el sistema
        run: docker compose up -d --wait --wait-timeout 180

      - name: Smoke test
        run: |
          set -euo pipefail
          # Se guarda cada respuesta antes de buscar en ella: `curl | grep -q` puede
          # cortar el pipe antes de tiempo y dar un falso error.
          health=$(curl -fsS http://localhost/api/health); echo "$health"
          grep -q '"status":"ok"' <<<"$health"
          grep -q '"version":"local"' <<<"$health"
          sucursales=$(curl -fsS http://localhost/api/sucursales); echo "$sucursales"
          grep -q 'Viedma (Chacra)' <<<"$sucursales"
          home=$(curl -fsS http://localhost/)
          grep -q '<div id="root">' <<<"$home"

          # Cabeceras de seguridad de Nginx en la página, en los archivos con
          # caché y en la API (Sprint 8, #17). Nginx no dice su versión.
          asset=$(grep -oE '/assets/[^"]+\.js' <<<"$home" | head -1)
          for ruta in / "$asset" /api/health; do
            cabeceras=$(curl -fsS -D - -o /dev/null "http://localhost$ruta")
            echo "== $ruta"; echo "$cabeceras"
            for c in 'content-security-policy: default-src' 'x-frame-options: DENY' \
                     'x-content-type-options: nosniff' 'referrer-policy:' 'permissions-policy:'; do
              grep -qi "^$c" <<<"$cabeceras" || { echo "Falta la cabecera $c en $ruta"; exit 1; }
            done
            if grep -qiE '^server: nginx/[0-9]|^x-powered-by' <<<"$cabeceras"; then
              echo "$ruta dice con qué está hecho el servidor"; exit 1
            fi
          done

          # Sin sesión, /me y las rutas de negocio responden 401.
          for ruta in auth/me pedidos insumos usuarios cierres/hoy caja-central/resumen dashboard/dia; do
            codigo=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost/api/$ruta")
            echo "/api/$ruta sin sesión: $codigo"; test "$codigo" = 401
          done
          # El admin inicial entra y la cookie abre /me.
          curl -fsS -c cookies.txt -H 'Content-Type: application/json' \
            -d "{\"usuario\":\"$ADMIN_USUARIO\",\"password\":\"$ADMIN_PASSWORD\"}" \
            http://localhost/api/auth/login >/dev/null
          me=$(curl -fsS -b cookies.txt http://localhost/api/auth/me); echo "$me"
          grep -q '"rol":"ADMIN"' <<<"$me"
          # Con la sesión del admin, las rutas de negocio responden.
          pedidos=$(curl -fsS -b cookies.txt http://localhost/api/pedidos); echo "$pedidos"
          usuarios=$(curl -fsS -b cookies.txt http://localhost/api/usuarios); echo "$usuarios"
          grep -q "\"usuario\":\"$ADMIN_USUARIO\"" <<<"$usuarios"
          # Las categorías de gasto de la planilla vienen cargadas por la migración.
          categorias=$(curl -fsS -b cookies.txt http://localhost/api/cierres/categorias); echo "$categorias"
          grep -q '"nombre":"Varios"' <<<"$categorias"
          # La caja central arranca con los dueños de la planilla.
          duenos=$(curl -fsS -b cookies.txt http://localhost/api/caja-central/duenos); echo "$duenos"
          grep -q '"nombre":"Fernanda"' <<<"$duenos"
          # La dueña carga un cierre de caja y un segundo del mismo turno da 409.
          cierre='{"sucursal_id":2,"turno":"NOCHE","total_controlador":1000,"efectivo_contado":1500,"cambio_fijo":500}'
          creado=$(curl -fsS -b cookies.txt -H 'Content-Type: application/json' -d "$cierre" http://localhost/api/cierres); echo "$creado"
          grep -q '"diferencia":0' <<<"$creado"
          codigo=$(curl -s -o /dev/null -w '%{http_code}' -b cookies.txt -H 'Content-Type: application/json' -d "$cierre" http://localhost/api/cierres)
          echo "cierre repetido: $codigo"; test "$codigo" = 409
          # El efectivo de ese cierre (1500 − 500 de cambio) entra solo a la caja central.
          resumen=$(curl -fsS -b cookies.txt http://localhost/api/caja-central/resumen); echo "$resumen"
          grep -q '"total_entradas":1000' <<<"$resumen"
          # Y el resumen de los dueños lo cuenta en lo vendido hoy.
          dia=$(curl -fsS -b cookies.txt http://localhost/api/dashboard/dia); echo "$dia"
          grep -q '"total":{"vendido":1000,' <<<"$dia"

          # ---- Observabilidad (Sprint 8, #18) ----
          # Cada respuesta de la API trae el id del request que genera Nginx.
          cabeceras=$(curl -fsS -D - -o /dev/null http://localhost/api/health)
          grep -qiE '^x-request-id: [0-9a-f]{32}' <<<"$cabeceras"
          # Las métricas se leen directo del backend: el cierre de Estrada de
          # recién figura como cargado y la API ya tiene tiempos medidos.
          metricas=$(curl -fsS http://localhost:3000/metrics)
          grep -q 'lafueguina_cierre_cargado_hoy{sucursal="Estrada",turno="NOCHE"} 1' <<<"$metricas"
          grep -q 'lafueguina_http_duracion_segundos_count{metodo="POST",ruta="/api/cierres",codigo="201"}' <<<"$metricas"
          # Desde afuera (Nginx) /metrics no existe: devuelve la pantalla, no las métricas.
          publica=$(curl -fsS http://localhost/metrics)
          if grep -q lafueguina_ <<<"$publica"; then echo "/metrics quedó público"; exit 1; fi

      # ---- Pruebas end-to-end (Sprint 4, #11) ----
      # Un Chromium del tamaño de un celular usa el sistema recién levantado,
      # como lo haría una persona: login, cierre de caja y revisión de la dueña.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Instalar Playwright
        working-directory: e2e
        run: |
          npm ci
          npm run format:check
          npx playwright install --with-deps chromium

      - name: Pruebas end-to-end
        working-directory: e2e
        env:
          E2E_URL: http://localhost
        run: npx playwright test

      - name: Guardar reporte de Playwright si falló
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

      - name: Logs si algo falló
        if: failure()
        run: docker compose logs --no-color

      - name: Apagar
        if: always()
        run: docker compose down -v

  # ---- Imágenes (Sprint 4, #11) ----
  # Cada imagen se construye para amd64 y arm64 y Trivy la revisa. En los PR sólo
  # se construye y se escanea; al mergear a main, las que pasaron se publican en
  # GitHub Container Registry con el SHA del commit como etiqueta.
  imagenes:
    name: Imagen ${{ matrix.imagen }} · multi-arch y Trivy
    needs: [test, migraciones]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Para publicar en GHCR. Sólo se usa en el push a main (ver PUBLICAR).
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # postgres es la imagen oficial que usa el compose: se escanea pero no se
        # construye ni se publica.
        imagen: [backend, frontend, postgres]
    env:
      PUBLICAR: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      IMAGEN: ghcr.io/joaquinlista/panaderia-gestion-${{ matrix.imagen }}
    steps:
      - uses: actions/checkout@v7

      - name: Imagen a revisar
        id: img
        run: |
          if [ "${{ matrix.imagen }}" = postgres ]; then
            ref=$(grep -m1 -oE 'image: postgres:[^ ]+' docker-compose.yml | cut -d' ' -f2)
          else
            ref="panaderia-gestion-${{ matrix.imagen }}:ci"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Imagen: $ref"

      - uses: docker/setup-qemu-action@v4
        if: matrix.imagen != 'postgres'

      - uses: docker/setup-buildx-action@v4
        if: matrix.imagen != 'postgres'

      # Trivy necesita la imagen en el Docker local, y Docker sólo puede cargar
      # una plataforma: se escanea la amd64. La arm64 tiene los mismos paquetes.
      - name: Construir amd64 para escanear
        if: matrix.imagen != 'postgres'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.imagen }}
          platforms: linux/amd64
          load: true
          tags: ${{ steps.img.outputs.ref }}
          # El SHA queda adentro de la imagen: /api/health y el pie de la pantalla
          # dicen qué versión está corriendo.
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.imagen }}
          cache-to: type=gha,mode=max,scope=${{ matrix.imagen }}

      - name: Trivy · reporte de vulnerabilidades altas y críticas
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ steps.img.outputs.ref }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: ${{ matrix.imagen == 'postgres' && '.trivyignore-postgres' || '' }}
          format: table
          exit-code: '0'

      # Sólo frena lo que tiene arreglo: si todavía no hay versión corregida, el
      # pipeline quedaría en rojo sin que se pueda hacer nada (ver decisiones.md).
      - name: Trivy · una vulnerabilidad crítica con arreglo frena el pipeline
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ steps.img.outputs.ref }}
          severity: CRITICAL
          ignore-unfixed: true
          trivyignores: ${{ matrix.imagen == 'postgres' && '.trivyignore-postgres' || '' }}
          format: table
          exit-code: '1'
          skip-setup-trivy: true

      - name: Entrar a GHCR
        if: env.PUBLICAR == 'true' && matrix.imagen != 'postgres'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir amd64 + arm64 (y publicar si es main)
        if: matrix.imagen != 'postgres'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.imagen }}
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLICAR == 'true' }}
          build-args: APP_VERSION=${{ github.sha }}
          tags: |
            ${{ env.IMAGEN }}:${{ github.sha }}
            ${{ env.IMAGEN }}:main
          cache-from: type=gha,scope=${{ matrix.imagen }}

      - name: Resumen
        if: matrix.imagen != 'postgres'
        run: |
          if [ "$PUBLICAR" = true ]; then
            echo "Publicada: \`$IMAGEN:${{ github.sha }}\` (amd64 + arm64)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Construida para amd64 + arm64 y escaneada. Se publica al mergear a main." >> "$GITHUB_STEP_SUMMARY"
          fi

