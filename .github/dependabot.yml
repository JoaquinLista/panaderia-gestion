# Dependabot abre PRs cuando hay versiones nuevas o parches de seguridad.
# Agrupamos las actualizaciones menores para no llenar el tablero de PRs.
version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    groups:
      menores:
        update-types: [minor, patch]
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    groups:
      menores:
        update-types: [minor, patch]
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: docker
    directories: [/backend, /frontend, /database]
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(docker)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(ci)
