# Dependabot abre PRs cuando hay versiones nuevas o parches de seguridad.
#
# Grupos: los paquetes que tienen que subir juntos (vitest + su plugin de coverage,
# react + react-dom, vite + su plugin de React) van en un solo PR. Si subieran por
# separado, cada PR quedaría con versiones incompatibles y el pipeline fallaría.
# Las actualizaciones menores y parches también se agrupan para no llenar el tablero.
version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    groups:
      vitest:
        patterns: ['vitest', '@vitest/*']
      eslint:
        patterns: ['eslint', '@eslint/*']
      menores:
        update-types: [minor, patch]
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    groups:
      vitest:
        patterns: ['vitest', '@vitest/*']
      react:
        patterns: ['react', 'react-dom']
      vite:
        patterns: ['vite', '@vitejs/*']
      eslint:
        patterns: ['eslint', '@eslint/*', 'eslint-plugin-*']
      testing-library:
        patterns: ['@testing-library/*']
      menores:
        update-types: [minor, patch]
    commit-message:
      prefix: chore(deps)

  # Pruebas end-to-end: el paquete de Playwright trae su propio navegador, así
  # que conviene tenerlo al día.
  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
      day: monday
    groups:
      menores:
        update-types: [minor, patch]
    commit-message:
      prefix: chore(deps)

  # Imágenes base: los saltos de versión mayor de Node y Postgres se hacen a mano.
  # (Postgres se usa como imagen oficial en docker-compose.yml, que Dependabot no revisa.)
  # Node: sólo versiones LTS (las pares pasan a LTS en octubre), y Dependabot no
  # distingue LTS de "current". Postgres: un cambio de versión mayor requiere migrar
  # los datos del volumen (pg_upgrade o dump/restore), no alcanza con cambiar la imagen.
  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule:
      interval: weekly
      day: monday
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
      - dependency-name: postgres
        update-types: [version-update:semver-major]
    commit-message:
      prefix: chore(docker)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: chore(ci)
