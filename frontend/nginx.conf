server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión básica
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # DNS interno de Docker: resuelve el nombre "backend" en cada request, no al
    # arrancar. Con el nombre escrito directo en proxy_pass, nginx se niega a
    # levantar si el backend todavía no existe ("host not found in upstream").
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_api http://backend:3000;

    # Todo lo que llega a /api/ se reenvía al backend por la red interna de compose.
    # proxy_pass con variable y SIN barra final: se preserva la URI completa
    # (/api/pedidos -> http://backend:3000/api/pedidos).
    location /api/ {
        proxy_pass $backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Assets con hash: cache agresivo
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: cualquier ruta desconocida devuelve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
