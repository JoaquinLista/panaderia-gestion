# Cabeceras de seguridad (Sprint 8, #17). Se incluyen en cada `location` que
# agrega sus propias cabeceras: en Nginx, un add_header dentro de un location
# hace que se ignoren los del server.

# Qué puede cargar la página: sólo archivos de la propia app; nada de scripts
# ni estilos escritos dentro del HTML (así un texto inyectado no se ejecuta).
# Los anchos de las barras del resumen no cuentan: React los pone desde
# JavaScript. frame-ancestors 'none': nadie puede meter la app en otra página.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
# Lo mismo para navegadores viejos que no entienden frame-ancestors.
add_header X-Frame-Options "DENY" always;
# El navegador no "adivina" el tipo de un archivo: un .txt no se ejecuta como script.
add_header X-Content-Type-Options "nosniff" always;
# A otros sitios sólo se les dice de qué dominio viene la visita, no la página.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# La app no usa cámara, micrófono ni ubicación.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Aísla la ventana de la app de ventanas abiertas por otros sitios.
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Con HTTPS (Azure), el navegador ya no intenta entrar por HTTP durante un año.
# Por HTTP (docker compose en la compu) los navegadores la ignoran.
add_header Strict-Transport-Security "max-age=31536000" always;
